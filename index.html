<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Queens">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15181e">
<meta name="build" content="queens-phase2">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Kitchen Table Queens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #f5f4ef;
    --paper-2: #e9e8e1;
    --ink: #1f2430;
    --ink-soft: #5b6170;
    --line-thin: #a8adb8;
    --accent: #1f56c9;
    --wrong: #c1302a;
    --wrong-wash: rgba(193, 48, 42, .30);
    --ok: #2a7d4f;
    --btn: #ffffff;
    --btn-2: #eef1f7;
    --btn-border: #c9ccd4;
    --btn-active: #1f2430;
    --btn-active-ink: #f5f4ef;
    --x-ink: rgba(31, 36, 48, .5);
    /* the staged hint lays a film over the units a deduction is about */
    --lit-wash: rgba(31, 36, 48, .22);
    --crown: #1b1f28;
    --edge: #23282f;
    --shadow: 0 1px 0 rgba(31,36,48,.08), 0 6px 18px rgba(31,36,48,.10);
    --font-ui: 'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif;
    /* ten hues kept apart by lightness as well as colour, so they still read
       as ten different regions to a colour-blind eye */
    --reg0: #f4cf5e; --reg1: #7cb6e8; --reg2: #f6aec2; --reg3: #86cd92; --reg4: #bda0e8;
    --reg5: #ef9350; --reg6: #59c4be; --reg7: #d7cbb3; --reg8: #b94b57; --reg9: #6d77c8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #15181e; --paper-2: #1e222a; --ink: #e8e6df; --ink-soft: #9aa0ad;
      --line-thin: #3a404c; --accent: #86aaff;
      --wrong: #ff8a80; --wrong-wash: rgba(255, 138, 128, .28); --ok: #6fce97;
      --btn: #232831; --btn-2: #2a303b; --btn-border: #3a404c; --btn-active: #e8e6df; --btn-active-ink: #15181e;
      --x-ink: rgba(240, 238, 230, .62); --crown: #f6f3ea; --edge: #0b0e13;
      --lit-wash: rgba(255, 255, 255, .24);
      --shadow: 0 1px 0 rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
      --reg0: #9a7d1f; --reg1: #2f5f96; --reg2: #b06a83; --reg3: #3f7c4e; --reg4: #6a53a0;
      --reg5: #a25c22; --reg6: #1f6f6b; --reg7: #7d7462; --reg8: #7a2b33; --reg9: #3a4188;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #15181e; --paper-2: #1e222a; --ink: #e8e6df; --ink-soft: #9aa0ad;
    --line-thin: #3a404c; --accent: #86aaff;
    --wrong: #ff8a80; --wrong-wash: rgba(255, 138, 128, .28); --ok: #6fce97;
    --btn: #232831; --btn-2: #2a303b; --btn-border: #3a404c; --btn-active: #e8e6df; --btn-active-ink: #15181e;
    --x-ink: rgba(240, 238, 230, .62); --crown: #f6f3ea; --edge: #0b0e13;
    --lit-wash: rgba(255, 255, 255, .24);
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --reg0: #9a7d1f; --reg1: #2f5f96; --reg2: #b06a83; --reg3: #3f7c4e; --reg4: #6a53a0;
    --reg5: #a25c22; --reg6: #1f6f6b; --reg7: #7d7462; --reg8: #7a2b33; --reg9: #3a4188;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font-ui); font-variant-numeric: tabular-nums;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
  }

  /* ---------------------------------------------------------- frame */
  .app {
    --board: min(94vw, calc(100dvh - 300px));
    --n: 8;
    --cell: calc(var(--board) / var(--n));
    --thick: clamp(3px, calc(var(--cell) * .05), 5px);
    min-height: 100dvh;
    display: grid; grid-template-rows: auto 1fr;
    padding: max(10px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    gap: 14px; max-width: 1400px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  header h1 svg { width: 22px; height: 22px; fill: var(--accent); }
  header .right { display: flex; align-items: center; gap: 12px; }
  header .sub { font-size: 15px; color: var(--ink-soft); max-width: 46ch; }
  button.pill {
    font: inherit; font-family: var(--font-ui); font-size: 15px; font-weight: 700; color: var(--ink);
    background: var(--btn); border: 1.5px solid var(--btn-border); border-radius: 999px;
    padding: 6px 15px; min-height: 38px; cursor: pointer; touch-action: manipulation; white-space: nowrap;
  }
  button.pill:focus-visible, button.tool:focus-visible, .btn:focus-visible, .seg:focus-visible, .cell:focus-visible, input[type=range]:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  main.play { display: grid; grid-template-columns: 1fr; justify-items: center; align-content: start; gap: 18px; }
  @media (orientation: landscape) and (min-width: 760px) {
    .app { --board: min(calc(100dvh - 120px), calc(100vw - 460px)); }
    main.play {
      grid-template-columns: var(--board) minmax(340px, 430px);
      justify-content: center; align-content: center; align-items: center; gap: 34px;
    }
  }

  /* ---------------------------------------------------------- board */
  /* coordinates: letters across the top, numbers down the left, so a square
     can be named out loud ("C5") while talking a board through */
  .board-wrap {
    --gutter: clamp(18px, calc(var(--cell) * .34), 26px);
    width: var(--board);
    display: grid; grid-template-columns: var(--gutter) 1fr; grid-template-rows: var(--gutter) 1fr;
  }
  .coords { display: grid; font-family: var(--font-ui); font-size: clamp(11px, calc(var(--gutter) * .58), 15px); font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; pointer-events: none; }
  .coords.top { grid-column: 2; grid-row: 1; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); align-items: end; padding: 0 var(--thick) 3px; }
  .coords.left { grid-column: 1; grid-row: 2; grid-template-rows: repeat(var(--n), minmax(0, 1fr)); align-items: center; justify-items: end; padding: var(--thick) 5px var(--thick) 0; }
  .coords span { text-align: center; min-width: 0; }
  .board-wrap .board { grid-column: 2; grid-row: 2; }
  .board {
    display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr)); aspect-ratio: 1;
    gap: 1px; background: var(--line-thin);
    border: var(--thick) solid var(--edge); border-radius: 6px;
    box-shadow: var(--shadow); touch-action: none; overflow: hidden;
  }
  .cell {
    position: relative; border: 0; padding: 0; margin: 0; cursor: pointer; min-width: 0; min-height: 0; overflow: hidden;
    background: var(--reg); display: grid; place-items: center;
    box-shadow: var(--edges);
  }
  /* both glyphs are absolute so their percentage sizes resolve against the
     cell, not against an auto-sized grid track */
  .cell .crown { position: absolute; left: 19%; top: 19%; width: 62%; height: 62%; fill: var(--crown); opacity: 0; transform: scale(.62); pointer-events: none; }
  .cell .x { position: absolute; left: 35%; top: 35%; width: 30%; height: 30%; opacity: 0; pointer-events: none; }
  .cell .x::before, .cell .x::after {
    content: ''; position: absolute; left: -4%; right: -4%; top: 44%; bottom: 44%;
    background: var(--x-ink); border-radius: 2px;
  }
  .cell .x::before { transform: rotate(45deg); }
  .cell .x::after { transform: rotate(-45deg); }
  .cell[data-mark="1"] .x { opacity: 1; }
  .cell[data-mark="2"] .crown { opacity: 1; transform: scale(1); }
  .cell.bad::after {
    content: ''; position: absolute; inset: 0; background: var(--wrong-wash);
    box-shadow: inset 0 0 0 var(--thick) var(--wrong);
  }
  .cell.bad .crown { fill: var(--wrong); }
  /* the hint has to be findable on all ten region colours in both themes, so it
     is a white band ringed in near-black rather than a tinted wash */
  .cell.hinted::after {
    content: ''; position: absolute; inset: 0;
    box-shadow: inset 0 0 0 var(--thick) #ffffff, inset 0 0 0 calc(var(--thick) * 2) #101319;
  }
  .cell .hint { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .cell .hint svg {
    position: absolute; left: 22%; top: 22%; width: 56%; height: 56%;
    fill: #ffffff; stroke: #101319; stroke-width: 1.6; paint-order: stroke fill;
  }
  .cell.hinted .hint { opacity: 1; }
  /* the "that crown is wrong" hint lands on a square that already has a crown;
     no ghost crown on top of the real one */
  .cell.hinted[data-mark="2"] .hint svg { display: none; }
  /* That hint also lands on a crown that is usually clashing, and the red wash
     already owns ::after there. So it marks with the .hint span instead and the
     red shows through underneath; the cell ring only appears when there is no
     red to keep. */
  .cell.wronghint:not(.bad)::after {
    content: ''; position: absolute; inset: 0;
    box-shadow: inset 0 0 0 var(--thick) #ffffff, inset 0 0 0 calc(var(--thick) * 2) #101319;
  }
  .cell.wronghint .hint { opacity: 1; }
  .cell.wronghint .hint svg { display: none; }
  .cell.wronghint .hint::before {
    content: ''; position: absolute; inset: 16%; border-radius: 50%;
    border: 3px solid #ffffff; box-shadow: 0 0 0 1.5px rgba(16,19,25,.75);
  }

  /* ------------------------------------------------------ staged hint
     A deduction is shown on the board itself: a film over the rows, columns
     and colours it is about, a white ring on the squares that make the case,
     and a faint X where each cross is about to go. The film has to read on
     ten region colours in both themes, so it is a neutral wash rather than a
     tint, and the ring is the same white on near-black as the hint marker. */
  .cell .wash { position: absolute; inset: 0; pointer-events: none; }
  .cell.lit .wash { background: var(--lit-wash); }
  .cell.focus .wash {
    box-shadow: inset 0 0 0 var(--thick) #ffffff, inset 0 0 0 calc(var(--thick) + 1.5px) rgba(16,19,25,.8);
  }
  /* the crosses a hint is offering, not yet made */
  .cell.ghost .x { opacity: .42; }

  /* ---------------------------------------------------------- panel */
  .panel { width: var(--board); display: grid; gap: 14px; align-content: start; }
  @media (orientation: landscape) and (min-width: 760px) { .panel { width: auto; gap: 16px; } }
  .statsblock { display: grid; gap: 2px; }
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1 1 0; min-width: 0; display: grid; gap: 2px; }
  .stat span { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
  .stat b { font-size: 22px; font-weight: 700; }
  .stat.mistakes.has b { color: var(--wrong); }
  /* the clock is a quiet number, not a score, and it can be sent away entirely */
  .stat.time b { font-size: 17px; font-weight: 400; color: var(--ink-soft); }
  button.quiet {
    justify-self: end; font: inherit; font-family: var(--font-ui); font-size: 14px;
    color: var(--ink-soft); background: none; border: 0; border-radius: 8px;
    padding: 4px 6px; min-height: 40px; cursor: pointer; touch-action: manipulation;
    text-decoration: underline; text-underline-offset: 3px;
  }
  button.quiet:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tools.two { grid-template-columns: 1fr 1fr; }
  .tools.three { grid-template-columns: repeat(3, 1fr); }
  button.tool {
    font: inherit; font-family: var(--font-ui); font-size: 17px; font-weight: 700;
    min-height: 62px; border-radius: 13px; border: 1.5px solid var(--btn-border);
    background: var(--btn); color: var(--ink); cursor: pointer; touch-action: manipulation;
    display: grid; place-items: center; gap: 1px; padding: 6px 4px;
  }
  button.tool small { font-size: 12px; font-weight: 400; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }
  button.tool.on { background: var(--btn-active); color: var(--btn-active-ink); border-color: var(--btn-active); }
  button.tool.on small { color: var(--btn-active-ink); opacity: .78; }
  button.tool:disabled { opacity: .38; cursor: default; }
  button.tool:active:not(:disabled) { transform: translateY(1px); }
  button.tool.wide { grid-column: 1 / -1; min-height: 54px; }

  .note { margin: 0; min-height: 22px; font-size: 16px; line-height: 1.35; color: var(--ok); }
  /* the hint, and the button that makes the crosses it is offering */
  .hintrow { display: grid; gap: 4px; justify-items: start; }
  .replaybar { display: grid; gap: 10px; }
  .note.warn { color: var(--wrong); }
  .record { margin: 0; font-size: 14px; color: var(--ink-soft); }
  .build { margin: 0; font-size: 11px; color: var(--ink-soft); opacity: .6; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: .03em; }

  .segs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg {
    font: inherit; font-family: var(--font-ui); font-size: 17px; font-weight: 700;
    min-height: 54px; border-radius: 13px; border: 1.5px solid var(--btn-border);
    background: var(--btn); color: var(--ink); cursor: pointer; touch-action: manipulation;
  }
  .seg.on { background: var(--btn-active); color: var(--btn-active-ink); border-color: var(--btn-active); }

  .field { display: grid; gap: 8px; }
  .field > span { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
  .sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .nav { display: grid; grid-template-columns: 62px 1fr 62px; gap: 10px; align-items: center; }
  .nav .where { text-align: center; font-size: 17px; font-weight: 700; }
  .nav .where small { display: block; font-size: 13px; font-weight: 400; color: var(--ink-soft); }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--accent) var(--fill, 0%), var(--btn-border) var(--fill, 0%)); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; margin-top: -15px; border-radius: 50%; background: var(--btn); border: 3px solid var(--accent); box-shadow: var(--shadow); }
  input[type="range"]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--btn-border); }
  input[type="range"]::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--accent); }
  input[type="range"]::-moz-range-thumb { width: 34px; height: 34px; border-radius: 50%; background: var(--btn); border: 3px solid var(--accent); }
  .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
  .btn {
    font: inherit; font-family: var(--font-ui); font-size: 18px; font-weight: 700;
    min-height: 60px; padding: 0 22px; border-radius: 13px;
    border: 1.5px solid var(--btn-border); background: var(--btn); color: var(--ink); cursor: pointer; touch-action: manipulation;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ---------------------------------------------------------- dialogs */
  .veil { position: fixed; inset: 0; background: rgba(12, 15, 20, .6); display: grid; place-items: center; padding: 20px; z-index: 10; }
  .sheet {
    background: var(--paper); color: var(--ink); border-radius: 18px; padding: 24px;
    width: min(100%, 480px); max-height: 88dvh; overflow: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.4); display: grid; gap: 16px;
  }
  .sheet.wide { width: min(100%, 620px); }
  .sheet h2 { margin: 0; font-size: 24px; text-wrap: balance; }
  .sheet p { margin: 0; font-size: 17px; color: var(--ink-soft); line-height: 1.45; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .solved-time { font-size: 42px; font-weight: 700; color: var(--ok); }
  .rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 22px; }
  .rules li { display: grid; gap: 10px; justify-items: center; }
  .rules p { color: var(--ink); }
  .sheet.map { width: min(100%, 760px); }
  .map-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; }
  button.maptile {
    font: inherit; font-family: var(--font-ui); position: relative; aspect-ratio: 1; min-width: 0;
    border-radius: 11px; border: 1.5px solid var(--btn-border); background: var(--btn); color: var(--ink);
    cursor: pointer; touch-action: manipulation; padding: 2px;
    display: grid; align-content: center; justify-items: center; gap: 1px;
  }
  button.maptile b { font-size: 17px; font-weight: 700; }
  button.maptile small { font-size: 11px; color: var(--ink-soft); }
  button.maptile .tick { position: absolute; top: 4px; inset-inline-end: 5px; width: 12px; height: 12px; fill: var(--ok); }
  button.maptile.done { border-color: var(--ok); }
  button.maptile.now { background: var(--btn-active); color: var(--btn-active-ink); border-color: var(--btn-active); }
  button.maptile.now small { color: var(--btn-active-ink); opacity: .8; }
  button.maptile.now .tick { fill: var(--btn-active-ink); opacity: .8; }
  button.maptile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .demo { display: grid; gap: 1px; background: var(--line-thin); border: 3px solid var(--edge); border-radius: 5px; width: 176px; }
  .demo .cell { cursor: default; }
  .cap { font-size: 14px; color: var(--ink-soft); text-align: center; }

  @media (prefers-reduced-motion: no-preference) {
    .cell .crown { transition: opacity 150ms ease, transform 170ms cubic-bezier(.2,.9,.3,1.4); }
    .cell .x { transition: opacity 160ms ease; }
    button.tool, .seg, .btn, body { transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease; }
    /* a crown lands with a little overshoot, so the placement registers */
    .cell.pop .crown { animation: crownPop 180ms cubic-bezier(.2,.9,.3,1.5); }
    @keyframes crownPop { from { opacity: 0; transform: scale(.5); } 62% { opacity: 1; transform: scale(1.16); } to { transform: scale(1); } }
    /* a cross fades up instead of snapping on */
    .cell.xin .x { animation: xIn 170ms ease-out; }
    @keyframes xIn { from { opacity: 0; transform: scale(.6); } }
    /* every square in a clash shakes, not only the one just tapped */
    .cell.shake { animation: shake .32s ease; }
    @keyframes shake { 0%,100% { transform: none; } 22% { transform: translateX(-4px); } 45% { transform: translateX(4px); } 68% { transform: translateX(-3px); } }
    /* a new board arrives along a diagonal, corner to corner in about 400ms */
    .cell.intro { animation: intro 220ms ease-out both; animation-delay: var(--d, 0ms); }
    @keyframes intro { from { opacity: 0; transform: scale(.86); } }
    /* a row, column or colour that just got its crown legally brightens once */
    .cell.unit { animation: unit .5s ease both; animation-delay: var(--d, 0ms); }
    @keyframes unit { 35% { filter: brightness(1.3) saturate(1.12); transform: scale(1.05); } }
    /* the finished board: brightness sweeps corner to corner and the crowns bounce */
    .cell.win { animation: winSweep .72s ease both; animation-delay: var(--d, 0ms); }
    @keyframes winSweep { 40% { filter: brightness(1.45) saturate(1.15); transform: scale(1.06); } }
    .cell.win .crown { animation: crownBounce .5s ease both; animation-delay: var(--d, 0ms); }
    @keyframes crownBounce { 35% { transform: translateY(-14%) scale(1.22); } 72% { transform: translateY(0) scale(.95); } to { transform: scale(1); } }
    /* the crosses a hint is about to make breathe, so they read as an offer
       rather than as marks already on the board */
    .cell.ghost .x { animation: ghostX 1.5s ease-in-out infinite; }
    @keyframes ghostX { 0%, 100% { opacity: .24; } 50% { opacity: .62; } }
    /* the hint sends out two soft rings so her eye finds the square */
    .cell.hinted .hint::before, .cell.hinted .hint::after {
      content: ''; position: absolute; inset: 16%; border-radius: 50%;
      border: 3px solid #ffffff; box-shadow: 0 0 0 1.5px rgba(16,19,25,.75);
      opacity: 0; animation: hintRing 1.15s ease-out 2;
    }
    .cell.hinted .hint::after { animation-delay: .3s; }
    .cell.wronghint .hint::after {
      content: ''; position: absolute; inset: 16%; border-radius: 50%;
      border: 3px solid #ffffff; box-shadow: 0 0 0 1.5px rgba(16,19,25,.75);
      opacity: 0; animation: hintRing 1.15s ease-out 2;
    }
    @keyframes hintRing { 0% { opacity: 0; transform: scale(.55); } 18% { opacity: .9; } 100% { opacity: 0; transform: scale(1.35); } }
    .veil { animation: veilIn 160ms ease-out; }
    .veil .sheet { animation: popIn 230ms cubic-bezier(.2,.8,.3,1.1) both; }
    @keyframes veilIn { from { opacity: 0; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="crown" viewBox="0 0 24 24">
  <path d="M2.7 7.1c.85 0 1.55.7 1.55 1.55 0 .43-.18.82-.46 1.1L5.9 12.6 10.5 5.5a1.6 1.6 0 1 1 3 0l4.6 7.1 2.11-2.85a1.55 1.55 0 1 1 1.09.45h-.02l-1.53 8.2H4.25L2.72 10.2a1.55 1.55 0 0 1 0-3.1Z"/>
  <rect x="4.1" y="18.9" width="15.8" height="2.7" rx="1.1"/>
</symbol></svg>

<div class="app">
  <header>
    <h1><svg aria-hidden="true"><use href="#crown"></use></svg><span data-i18n="title">Kitchen Table Queens</span></h1>
    <div class="right">
      <div class="sub" id="status"></div>
      <button class="pill" id="themeBtn" type="button">Light</button>
    </div>
  </header>

  <main class="play">
    <div class="board-wrap"><div class="coords top" id="coordsTop" aria-hidden="true"></div><div class="coords left" id="coordsLeft" aria-hidden="true"></div><div class="board" id="board" role="grid" aria-label="Queens board"></div></div>

    <aside class="panel">
      <div class="statsblock">
        <div class="stats">
          <div class="stat"><span data-i18n="puzzle">Puzzle</span><b id="puzzleLabel">1</b></div>
          <div class="stat time" id="timeWrap"><span data-i18n="time">Time</span><b id="timer">0:00</b></div>
          <div class="stat mistakes" id="mistakesWrap"><span data-i18n="mistakes">Mistakes</span><b id="mistakes">0</b></div>
        </div>
        <button class="quiet" id="timerBtn" type="button">Hide timer</button>
      </div>

      <div class="tools">
        <button class="tool" id="undoBtn" type="button" disabled><span data-i18n="undo">Undo</span></button>
        <button class="tool" id="hintBtn" type="button"><span data-i18n="hint">Hint</span></button>
        <button class="tool" id="clearBtn" type="button"><span data-i18n="clear">Clear</span></button>
        <button class="tool on" id="autoBtn" type="button"><span data-i18n="autoX">Auto X</span><small id="autoState">on</small></button>
      </div>

      <div class="hintrow">
        <p class="note" id="hintLine"></p>
        <button class="quiet" id="hintApply" type="button" hidden data-i18n="hintApply">Cross them out</button>
      </div>

      <div class="replaybar" id="replayBar" hidden>
        <p class="note" id="replayText"></p>
        <div class="tools three">
          <button class="tool" id="replayBack" type="button" data-i18n="back">Back</button>
          <button class="tool" id="replayNext" type="button" data-i18n="next">Next</button>
          <button class="tool" id="replayDone" type="button" data-i18n="doneReplay">Done</button>
        </div>
        <p class="record" id="replayWhere"></p>
      </div>

      <div class="segs" role="radiogroup" aria-label="Mode">
        <button class="seg on" id="modeCampaign" type="button" data-i18n="campaign">Campaign</button>
        <button class="seg" id="modeRandom" type="button" data-i18n="random">Random</button>
      </div>

      <div class="nav" id="campaignRow">
        <button class="tool" id="prevBtn" type="button" aria-label="Previous level">&#8249;</button>
        <div class="where"><span id="levelWhere">Level 1 of 150</span><small id="levelBand">easy</small></div>
        <button class="tool" id="nextBtn" type="button" aria-label="Next level">&#8250;</button>
      </div>

      <div class="field" id="randomRow" hidden>
        <span data-i18n="size">Size</span>
        <div class="sizes" id="sizes"></div>
        <span data-i18n="difficulty">Difficulty</span>
        <input type="range" id="diff" min="0" max="2" step="1" value="0" aria-label="Difficulty">
        <div class="ends"><span data-i18n="easy">Easy</span><span data-i18n="hard">Hard</span></div>
        <button class="btn primary" id="newBtn" type="button" data-i18n="newPuzzle">New puzzle</button>
      </div>

      <p class="record" id="record"></p>
      <div class="tools two">
        <button class="tool" id="levelsBtn" type="button"><span data-i18n="allLevels">All puzzles</span></button>
        <button class="tool" id="helpBtn" type="button"><span data-i18n="help">How to play</span></button>
      </div>
      <p class="build" id="build" aria-hidden="true"></p>
    </aside>
  </main>
</div>

<script>
  // the build stamp comes from the solver's cache tag, so a screenshot says which build it is
  (function () {
    var tag = document.querySelector('script[src^="core.js"]');
    var m = tag && /[?&]v=([^&]+)/.exec(tag.getAttribute('src'));
    var el = document.getElementById('build');
    if (el && m) el.textContent = 'build ' + m[1];
  })();
</script>
<script>
(() => {
  'use strict';
  const C = window.QueensCore;
  const LEVELS = window.QUEENS_LEVELS;
  const $ = s => document.getElementById(s);

  // ------------------------------------------------------------- language
  const STR = {
    en: {
      title: 'Kitchen Table Queens', dark: 'Dark', light: 'Light',
      status: 'One crown in every row, every column and every colour. Crowns may never touch.',
      puzzle: 'Puzzle', time: 'Time', mistakes: 'Mistakes',
      undo: 'Undo', hint: 'Hint', clear: 'Clear', autoX: 'Auto X', on: 'on', off: 'off',
      hideTimer: 'Hide timer', showTimer: 'Show timer',
      campaign: 'Campaign', random: 'Random', size: 'Size', difficulty: 'Difficulty',
      easy: 'Easy', medium: 'Medium', hard: 'Hard', newPuzzle: 'New puzzle',
      levelWhere: 'Level {n} of {total}', randomWhere: 'Random {size}',
      solvedBadge: 'solved', help: 'How to play', gotIt: 'Got it',
      allLevels: 'All puzzles', close: 'Close',
      mapText: 'Tap any puzzle to play it. None of them are locked.',
      clearTitle: 'Clear the board?', clearText: 'Every crown and cross comes off. The clock keeps running.',
      keep: 'Keep playing', clearYes: 'Clear it',
      solvedTitle: 'Solved!', solvedNote: 'A {size} board with {m} mistakes.', solvedNote1: 'A {size} board with one mistake.', solvedNoteClean: 'A {size} board with no mistakes at all.',
      newBest: 'Your best time yet on a {size} board.', look: 'Look at it', nextLevel: 'Next puzzle',
      newBestLevel: 'Your best time yet on this puzzle.', yourBest: 'Your best on this puzzle is {t}.',
      best: 'Best {size}: {t}', noBest: 'Finish a board and your best time shows up here.',
      hintApply: 'Cross them out',
      hintCrossed: 'Those are crossed out. Tap Hint again for the next step.',
      showReasoning: 'Show me the reasoning',
      back: 'Back', next: 'Next', doneReplay: 'Done',
      replayWhere: 'Step {n} of {total}',
      whyRow: 'Only one square is left in this row.',
      whyCol: 'Only one square is left in this column.',
      whyRegion: 'Only one square is left in this colour.',
      whySol: "This row's crown belongs here.",
      whyWrong: 'The crown on the marked square is in the wrong place. Take it off.',
      whyWrongCross: 'That cross on {cell} is wrong. A crown goes there. Tap it to clear it.',
      whyDone: 'Every crown is already placed.',
      r1: 'Every row and every column gets exactly one crown. Tap a square once for a cross, twice for a crown, once more to clear it. Drag your finger to cross out several squares at a time.',
      c1: 'Four crowns on a four-square board: one in every row, one in every column.',
      r2: 'Every colour gets exactly one crown too. That is the part that makes it a puzzle.',
      c2: 'The same four crowns, and now one sits in each of the four colours.',
      r3: 'Crowns may never touch, not even corner to corner. Every square around a crown is out.',
      c3: 'The crown in the middle rules out all eight squares around it.',
      r4: 'With Auto X on, a crown crosses out its own row, column and colour, and its neighbours, for you. Take that crown off and those crosses come off with it.',
      c4: 'One crown, and the board marks everything the crown rules out.',
    },
  };
  const KEY = 'kitchen-table-queens';
  const THEME_KEY = KEY + '-theme';
  const lang = 'en';
  const t = (k, vars) => (STR[lang][k] || STR.en[k] || k).replace(/\{(\w+)\}/g, (m, v) => (vars && vars[v] != null) ? vars[v] : m);
  const faNum = s => lang === 'fa' ? String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : String(s);
  const sizeLabel = n => faNum(n + '×' + n);
  const clock = sec => faNum(Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'));

  // ---------------------------------------------------------------- theme
  const isDark = () => !document.documentElement.hasAttribute('data-theme')
    ? matchMedia('(prefers-color-scheme: dark)').matches
    : document.documentElement.getAttribute('data-theme') === 'dark';
  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', mode === 'dark' ? '#15181e' : '#f5f4ef');
    $('themeBtn').textContent = mode === 'dark' ? t('light') : t('dark');
  }
  try { applyTheme(localStorage.getItem(THEME_KEY) || 'dark'); } catch (e) { applyTheme('dark'); }

  // ---------------------------------------------------------------- state
  let P = null;               // decoded puzzle { N, regions, sol, band }
  let marks = null;           // 0 empty, 1 cross, 2 crown
  let owners = null;          // who put each cross there: 'u' for the player, else a crown's cell index
  let history = [];
  let mistakes = 0, started = 0, elapsed = 0, running = false, solved = false;
  let autoX = true, showTimer = true;
  let mode = 'campaign', level = 0, randSize = 8, randBand = 0, randCode = null;
  let progress = {}, bests = {}, levelBests = {};
  let hintCell = -1, hintKind = '';
  let hintStep = null, hintStage = 0, hintFx = null;   // the staged hint
  let hintStages = null;      // the taps that walk it, one at a time
  let replay = null;          // the worked solution, replayed after a win
  let doneUnits = new Set();  // rows, columns and colours that already have their crown
  let elim = null;            // cells each crown rules out, for auto X

  const save = () => {
    const state = {
      mode, level, randSize, randBand, randCode,
      code: P ? C.encode(P) : null,
      marks: marks ? Array.from(marks).join('') : null,
      owners, mistakes, elapsed, solved, autoX, showTimer, bests,
      // The campaign was regenerated again when the rater stopped using the
      // rule the hint could not say out loud, so every board now finishes on
      // singles, subsets and touching alone and the bands are drawn on that
      // family. Level 12 is not the board it was, so per-level progress and
      // records move to fresh keys rather than crediting boards nobody played;
      // per-size records and the preferences keep their old ones.
      progress4: progress, levelBests4: levelBests,
    };
    // The undo stack is stored with the board, so closing the tab mid-puzzle does
    // not cost her the moves she might want back. Only the last 40 moves go to
    // disk. An entry is a marks string plus the owners map, and on a busy 10x10
    // with Auto X on it measures about 1.6 kB; what drives that is the crown
    // count rather than the cross count, since every crown adds its id to each
    // square it crossed. With Auto X off the same board is a tenth of that.
    // This runs on every tap, so the whole 200-deep in-memory stack would write
    // a third of a megabyte a tap for moves nobody walks back that far. If it
    // still will not fit, the board is saved without it rather than not at all.
    try { localStorage.setItem(KEY, JSON.stringify(Object.assign({ history: history.slice(-40) }, state))); return; } catch (e) {}
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  };

  // ---------------------------------------------------------------- motion
  const motionOK = () => matchMedia('(prefers-reduced-motion: no-preference)').matches;
  // restart an animation on one square: drop the class, force a reflow, put it back
  function fx(i, cls, delay) {
    const el = $('board').children[i];
    if (!el) return;
    el.classList.remove(cls);
    el.style.setProperty('--d', (delay || 0) + 'ms');
    void el.offsetWidth;
    el.classList.add(cls);
  }
  const FX_OF = { crownPop: 'pop', xIn: 'xin', shake: 'shake', intro: 'intro', unit: 'unit', winSweep: 'win' };
  $('board').addEventListener('animationend', e => {
    const c = e.target.closest ? e.target.closest('.cell') : null;
    const cls = FX_OF[e.animationName];
    if (c && cls) c.classList.remove(cls);
  });
  // the board arrives corner to corner, the whole wave inside about 400ms
  function introBoard() {
    if (!motionOK()) return;
    const N = P.N, step = Math.round(180 / Math.max(1, 2 * (N - 1)));
    for (let i = 0; i < N * N; i++) fx(i, 'intro', ((((i / N) | 0) + (i % N)) * step));
  }
  // every square of one row, column or colour
  function unitCells(key) {
    const N = P.N, k = +key.slice(1), out = [];
    if (key[0] === 'r') for (let c = 0; c < N; c++) out.push(k * N + c);
    else if (key[0] === 'c') for (let r = 0; r < N; r++) out.push(r * N + k);
    else for (let i = 0; i < N * N; i++) if (P.regions[i] === k) out.push(i);
    return out;
  }
  // the rows, columns and colours whose crown is placed and legal
  function unitKeys(bad) {
    const N = P.N, s = new Set();
    for (const i of queenCells()) {
      if (bad.has(i)) continue;
      s.add('r' + ((i / N) | 0)); s.add('c' + (i % N)); s.add('g' + P.regions[i]);
    }
    return s;
  }
  // a row, column or colour that just got its crown brightens once, so progress shows
  function nudgeUnits(bad, quiet) {
    const now = unitKeys(bad);
    const fresh = [];
    for (const k of now) if (!doneUnits.has(k)) fresh.push(k);
    doneUnits = now;
    if (quiet || !fresh.length || !motionOK()) return;
    const seen = new Set();
    for (const k of fresh) unitCells(k).forEach((i, n) => {
      if (seen.has(i)) return;
      seen.add(i);
      fx(i, 'unit', n * 34);
    });
  }

  // ----------------------------------------------------------- board build
  const colName = c => String.fromCharCode(65 + c);
  function buildBoard() {
    const N = P.N, board = $('board');
    document.querySelector('.app').style.setProperty('--n', N);
    board.style.setProperty('--n', N);
    board.textContent = '';
    $('coordsTop').innerHTML = Array.from({ length: N }, (_, c) => '<span>' + colName(c) + '</span>').join('');
    $('coordsLeft').innerHTML = Array.from({ length: N }, (_, r) => '<span>' + (r + 1) + '</span>').join('');
    for (let i = 0; i < N * N; i++) {
      const r = (i / N) | 0, c = i % N, g = P.regions[i];
      const b = document.createElement('button');
      b.className = 'cell';
      b.type = 'button';
      b.dataset.i = i;
      b.dataset.mark = '0';
      b.style.setProperty('--reg', 'var(--reg' + g + ')');
      // thick edges only where two colours meet; the outer frame is on the board
      const parts = [];
      if (r > 0 && P.regions[i - N] !== g) parts.push('inset 0 var(--thick) 0 0 var(--edge)');
      if (r < N - 1 && P.regions[i + N] !== g) parts.push('inset 0 calc(-1 * var(--thick)) 0 0 var(--edge)');
      if (c > 0 && P.regions[i - 1] !== g) parts.push('inset var(--thick) 0 0 0 var(--edge)');
      if (c < N - 1 && P.regions[i + 1] !== g) parts.push('inset calc(-1 * var(--thick)) 0 0 0 var(--edge)');
      b.style.setProperty('--edges', parts.length ? parts.join(',') : 'none');
      b.setAttribute('aria-label', colName(c) + (r + 1) + ', row ' + (r + 1) + ' column ' + colName(c));
      b.innerHTML = '<span class="wash"></span>'
        + '<svg class="crown" aria-hidden="true"><use href="#crown"></use></svg><span class="x"></span>'
        + '<span class="hint"><svg aria-hidden="true"><use href="#crown"></use></svg></span>';
      board.appendChild(b);
    }
    elim = elimSets(N, P.regions);
  }
  // row, column, colour and the eight neighbours: everything one crown rules out
  function elimSets(N, regions) {
    const touch = C.touching(N), out = new Array(N * N);
    for (let i = 0; i < N * N; i++) {
      const r = (i / N) | 0, c = i % N, g = regions[i], s = new Set();
      for (let k = 0; k < N; k++) { if (k !== c) s.add(r * N + k); if (k !== r) s.add(k * N + c); }
      for (let j = 0; j < N * N; j++) if (regions[j] === g && j !== i) s.add(j);
      for (const j of touch[i]) s.add(j);
      out[i] = Array.from(s);
    }
    return out;
  }

  // ------------------------------------------------------------ load a board
  function loadPuzzle(code, keep) {
    P = C.decode(code);
    buildBoard();
    if (!keep) {
      marks = new Uint8Array(P.N * P.N);
      owners = {};
      history = [];
      mistakes = 0; elapsed = 0; started = 0; running = false; solved = false;
    }
    replay = null;
    $('replayBar').hidden = true;
    clearHint();
    paint();
    nudgeUnits(C.conflicts(P.N, P.regions, queenCells()), true);
    introBoard();
    paintPanel();
    save();
  }
  function restoreMarks(str, own) {
    marks = new Uint8Array(P.N * P.N);
    for (let i = 0; i < marks.length && i < str.length; i++) marks[i] = +str[i] || 0;
    owners = own || {};
  }

  // ---------------------------------------------------------------- moves
  const queenCells = () => { const a = []; for (let i = 0; i < marks.length; i++) if (marks[i] === 2) a.push(i); return a; };

  function pushHistory() {
    history.push({ marks: Array.from(marks).join(''), owners: JSON.parse(JSON.stringify(owners)) });
    if (history.length > 200) history.shift();
  }
  function ownersOf(i) { return owners[i] || (owners[i] = []); }

  function setCross(i, by) {
    if (marks[i] === 2) return;
    marks[i] = 1;
    const o = ownersOf(i);
    if (o.indexOf(by) < 0) o.push(by);
  }
  function clearCell(i) { marks[i] = 0; delete owners[i]; }

  function placeQueen(i) {
    marks[i] = 2;
    delete owners[i];
    if (autoX) for (const j of elim[i]) if (marks[j] !== 2) setCross(j, i);
  }
  function removeQueen(i) {
    marks[i] = 0;
    delete owners[i];
    for (const key of Object.keys(owners)) {
      const o = owners[key];
      const at = o.indexOf(i);
      if (at < 0) continue;
      o.splice(at, 1);
      if (!o.length && marks[key] === 1) clearCell(+key);
      else if (!o.length) delete owners[key];
    }
  }
  // turning Auto X back on marks what the crowns already on the board rule out
  function reapplyAuto() {
    for (const i of queenCells()) for (const j of elim[i]) if (marks[j] !== 2) setCross(j, i);
  }

  function startClock() {
    if (running || solved) return;
    running = true; started = Date.now();
  }
  function stopClock() {
    if (!running) return;
    elapsed += Math.round((Date.now() - started) / 1000);
    running = false;
  }
  const nowElapsed = () => elapsed + (running ? Math.round((Date.now() - started) / 1000) : 0);

  function cycle(i) {
    if (solved) return;
    clearHint();
    pushHistory();
    startClock();
    const m = marks[i];
    if (m === 0) setCross(i, 'u');
    else if (m === 1) placeQueen(i);
    else removeQueen(i);
    if (motionOK() && m < 2) fx(i, m === 0 ? 'xin' : 'pop');
    afterMove(m === 1 ? i : -1);
  }

  function afterMove(placedAt) {
    const bad = C.conflicts(P.N, P.regions, queenCells());
    if (placedAt >= 0 && bad.has(placedAt)) {
      mistakes++;
      // both ends of the clash shake, so it is clear which two crowns disagree
      if (motionOK()) for (const j of bad) fx(j, 'shake');
    }
    paint(bad);
    const won = !bad.size && queenCells().length === P.N;
    nudgeUnits(bad, won);
    paintPanel();
    if (won) win();
    save();
  }

  function win() {
    solved = true;
    stopClock();
    const secs = elapsed;
    const key = String(P.N);
    const sizeBetter = bests[key] == null || secs < bests[key];
    if (sizeBetter) bests[key] = secs;
    // in the campaign each puzzle keeps its own record, so "new best" means this
    // board rather than any board of the same size
    let better = sizeBetter, prevLevel = null;
    if (mode === 'campaign') {
      progress[level] = true;
      prevLevel = levelBests[level] == null ? null : levelBests[level];
      better = prevLevel == null || secs < prevLevel;
      if (better) levelBests[level] = secs;
    }
    save();
    $('solvedTime').textContent = clock(secs);
    $('solvedTime').hidden = !showTimer;
    const noteKey = mistakes === 0 ? 'solvedNoteClean' : mistakes === 1 ? 'solvedNote1' : 'solvedNote';
    let note = t(noteKey, { size: sizeLabel(P.N), m: faNum(mistakes) });
    if (showTimer) {
      if (better) note += ' ' + t(mode === 'campaign' ? 'newBestLevel' : 'newBest', { size: sizeLabel(P.N) });
      else if (prevLevel != null) note += ' ' + t('yourBest', { t: clock(prevLevel) });
    }
    $('solvedNote').textContent = note;
    paintPanel();
    // the board sweeps bright corner to corner and the crowns bounce; the sheet
    // waits for that to be most of the way through
    const motion = motionOK();
    if (motion) {
      const N = P.N, step = Math.round(320 / Math.max(1, 2 * (N - 1)));
      for (let i = 0; i < N * N; i++) fx(i, 'win', ((((i / N) | 0) + (i % N)) * step));
    }
    setTimeout(() => show('solvedDialog'), motion ? 900 : 0);
  }

  // ---------------------------------------------------------------- paint
  const NO_CLASH = new Set();
  function paint(bad) {
    // the replay draws the solver's own board at that step, not hers
    const view = replay ? replay.marks : marks;
    if (replay) bad = NO_CLASH;
    else if (!bad) bad = C.conflicts(P.N, P.regions, queenCells());
    const fx = hintFx;
    const cells = $('board').children;
    for (let i = 0; i < cells.length; i++) {
      const el = cells[i];
      if (el.dataset.mark !== String(view[i])) el.dataset.mark = String(view[i]);
      el.classList.toggle('bad', bad.has(i));
      const isHint = i === hintCell;
      // the red-wins guard still applies to the ordinary hint, which shares
      // ::after with .bad; the wrong-crown hint does not, so it is never dropped
      el.classList.toggle('hinted', isHint && hintKind !== 'wrong' && !bad.has(i));
      el.classList.toggle('wronghint', isHint && hintKind === 'wrong');
      // the staged hint: the units it is about, the squares that make the
      // case, and the crosses it is offering
      el.classList.toggle('lit', !!fx && fx.lit.has(i));
      el.classList.toggle('focus', !!fx && fx.focus.has(i));
      el.classList.toggle('ghost', !!fx && fx.ghost.has(i) && view[i] === 0);
    }
  }
  function paintPanel() {
    if (showTimer) $('timer').textContent = clock(nowElapsed());
    $('mistakes').textContent = faNum(mistakes);
    $('mistakesWrap').classList.toggle('has', mistakes > 0);
    $('undoBtn').disabled = !history.length || solved;
    $('hintBtn').disabled = solved;
    $('autoBtn').classList.toggle('on', autoX);
    $('autoState').textContent = t(autoX ? 'on' : 'off');
    const bandName = ['easy', 'medium', 'hard'][P.band] || 'easy';
    if (mode === 'campaign') {
      $('puzzleLabel').textContent = faNum(level + 1);
      $('levelWhere').textContent = t('levelWhere', { n: faNum(level + 1), total: faNum(LEVELS.campaign.length) });
      $('levelBand').textContent = sizeLabel(P.N) + ' · ' + t(bandName) + (progress[level] ? ' · ' + t('solvedBadge') : '');
    } else {
      $('puzzleLabel').textContent = sizeLabel(P.N);
      $('levelWhere').textContent = t('randomWhere', { size: sizeLabel(P.N) });
      $('levelBand').textContent = t(bandName);
    }
    const b = bests[String(P.N)];
    $('record').hidden = !showTimer;
    $('record').textContent = b == null ? t('noBest') : t('best', { size: sizeLabel(P.N), t: clock(b) });
    for (const el of document.querySelectorAll('.sizes .seg')) el.classList.toggle('on', +el.dataset.size === randSize);
  }

  // ------------------------------------------------------------- pointer
  const board = $('board');
  let downCell = -1, dragging = false, paintMode = null, geo = null;
  // Squares are found by arithmetic rather than by hit-testing the element, so
  // the gaps, the thick colour borders and a band just outside the board all
  // land on the nearest square instead of on nothing.
  const SLOP = 14;
  function measure() {
    const r = board.getBoundingClientRect();
    const bw = parseFloat(getComputedStyle(board).borderTopWidth) || 0;
    return { left: r.left + bw, top: r.top + bw, w: r.width - bw * 2, h: r.height - bw * 2, n: P.N };
  }
  const cellAt = (x, y) => {
    if (!P) return -1;
    const g = geo || measure();
    if (x < g.left - SLOP || x > g.left + g.w + SLOP) return -1;
    if (y < g.top - SLOP || y > g.top + g.h + SLOP) return -1;
    const c = Math.min(g.n - 1, Math.max(0, Math.floor((x - g.left) / (g.w / g.n))));
    const r = Math.min(g.n - 1, Math.max(0, Math.floor((y - g.top) / (g.h / g.n))));
    return r * g.n + c;
  };
  board.addEventListener('pointerdown', e => {
    if (solved) return;
    geo = measure();
    const i = cellAt(e.clientX, e.clientY);
    if (i < 0) { geo = null; return; }
    downCell = i; dragging = false; paintMode = null;
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  board.addEventListener('pointermove', e => {
    if (downCell < 0) return;
    const i = cellAt(e.clientX, e.clientY);
    if (i < 0) return;
    if (!dragging) {
      if (i === downCell) return;
      // the drag begins: paint or rub out, decided by the square it began on
      dragging = true;
      paintMode = marks[downCell] === 1 ? 'erase' : 'paint';
      clearHint();
      pushHistory();
      startClock();
      applyPaint(downCell);
    }
    applyPaint(i);
  });
  const endDrag = e => {
    if (downCell < 0) return;
    const start = downCell;
    downCell = -1; geo = null;
    try { board.releasePointerCapture(e.pointerId); } catch (err) {}
    if (dragging) { dragging = false; afterMove(-1); }
    else cycle(start);
  };
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', () => { downCell = -1; dragging = false; geo = null; });
  addEventListener('resize', () => { geo = null; });
  function applyPaint(i) {
    if (paintMode === 'paint') { if (marks[i] === 0) { setCross(i, 'u'); if (motionOK()) fx(i, 'xin'); } }
    else if (marks[i] === 1) clearCell(i);
    paint();
  }
  board.addEventListener('keydown', e => {
    const c = e.target.closest ? e.target.closest('.cell') : null;
    if (!c) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); cycle(+c.dataset.i); }
  });

  // --------------------------------------------------------------- tools
  $('undoBtn').addEventListener('click', () => {
    if (!history.length || solved) return;
    const h = history.pop();
    restoreMarks(h.marks, h.owners);   // the mistake count is not rolled back
    clearHint();
    paint();
    nudgeUnits(C.conflicts(P.N, P.regions, queenCells()), true);
    paintPanel(); save();
  });
  function applyTimerVisibility() {
    $('timeWrap').hidden = !showTimer;
    $('timerBtn').textContent = t(showTimer ? 'hideTimer' : 'showTimer');
    if (P) paintPanel();
  }
  // the clock never ends a puzzle; hiding it just takes the number off the panel
  $('timerBtn').addEventListener('click', () => { showTimer = !showTimer; applyTimerVisibility(); save(); });
  $('clearBtn').addEventListener('click', () => show('confirmDialog'));
  $('confirmNo').addEventListener('click', () => hide('confirmDialog'));
  $('confirmYes').addEventListener('click', () => {
    hide('confirmDialog');
    if (solved) return;
    pushHistory();
    marks = new Uint8Array(P.N * P.N); owners = {}; clearHint();
    doneUnits = new Set();
    paint(); paintPanel(); save();
  });
  $('autoBtn').addEventListener('click', () => {
    autoX = !autoX;
    if (autoX) { pushHistory(); reapplyAuto(); paint(); }
    paintPanel(); save();
  });
  // ------------------------------------------------------------ the hint
  // Repeated taps walk one deduction. First the rule, in a sentence, with the
  // rows, columns and colours it is about washed over and the squares that
  // make the case ringed. Then the crosses that follow, drawn faintly where
  // they would go and named in the line. Then those crosses go on the board
  // for her, and if that hands her a crown straight away, the crown is marked
  // the way a hint always was. Every word of it comes from the solver working
  // on her crowns, so a hint can never say something the board does not hold.
  const crossedCells = () => {
    const s = new Set();
    for (let i = 0; i < marks.length; i++) if (marks[i] === 1) s.add(i);
    return s;
  };
  const unitKeyOf = u => (u.kind === 'row' ? 'r' : u.kind === 'col' ? 'c' : 'g') + u.k;
  function hintFxOf(w, ghosts) {
    const lit = new Set(), focus = new Set(), ghost = new Set();
    for (const u of w.units || []) for (const i of unitCells(unitKeyOf(u))) lit.add(i);
    // only the rules that turn on two or three named squares ring anything;
    // everywhere else the wash over the units has already said it
    for (const i of w.ring || []) focus.add(i);
    for (const i of ghosts || []) ghost.add(i);
    return { lit: lit, focus: focus, ghost: ghost };
  }

  // Two taps, the same two for every rule: the sentence with its wash and
  // rings, then the crosses that follow, named and drawn faintly where they
  // would go. There used to be a third kind of step that took more taps than
  // that, a crown supposed at some square and the crowns it forced walked out
  // one at a time in dashed rings. It is gone, along with the rule behind it:
  // a hint is a statement about the board as it stands, never a crown put
  // down to see what happens. A crown that can be proved outright still shows
  // at once, with no stages at all.
  function stagesOf(w) {
    const units = w.units || [], ring = w.ring || [];
    return [{ text: w.text, units: units, ring: ring },
            { text: w.text, units: units, ring: ring, offer: true }];
  }
  function clearHint(keepLine) {
    hintCell = -1; hintKind = ''; hintStep = null; hintStage = 0; hintFx = null; hintStages = null;
    $('hintApply').hidden = true;
    if (!keepLine) { $('hintLine').textContent = ''; $('hintLine').classList.remove('warn'); }
  }
  function sayHint(text, warn) {
    const line = $('hintLine');
    line.textContent = text;
    line.classList.toggle('warn', !!warn);
  }
  // the crosses of a step she has not already made herself
  const hintTodo = w => w.elim.filter(i => marks[i] === 0);
  function showCrown(w) {
    hintCell = w.place.r * P.N + w.place.c;
    hintKind = 'place';
    hintFx = hintFxOf(w, null);
    sayHint(w.text, false);
  }
  // the crosses go on as one move, so one Undo takes the whole hint back, and
  // they are marks like any other: nothing here counts as a mistake
  function finishStep(step) {
    const todo = hintTodo(step);
    if (todo.length) {
      pushHistory();
      startClock();
      for (const i of todo) if (marks[i] !== 2) setCross(i, 'h');
      paintPanel(); save();
    }
    clearHint(true);
    if (step.then) showCrown(step.then);
    else sayHint(t('hintCrossed'), false);
    paint();
  }
  function stepHint() {
    if (solved || replay) return;
    const w = C.explain(P.N, P.regions, P.sol, queenCells(), crossedCells());
    if (!w) { clearHint(true); paint(); sayHint(t('whyDone'), false); return; }
    // a crown in the wrong place is still the first thing said, and the only
    // thing said until it comes off
    if (w.rule === 'wrong') {
      clearHint(true);
      hintCell = w.r * P.N + w.c; hintKind = 'wrong';
      sayHint(t('whyWrong'), true);
      paint();
      return;
    }
    // a cross on a square the crown belongs on is the same kind of mistake, and
    // the same kind of answer: nothing else is said until it comes off
    if (w.rule === 'wrongcross') {
      clearHint(true);
      hintCell = w.r * P.N + w.c; hintKind = 'wrong';
      sayHint(t('whyWrongCross', { cell: C.cellName(P.N, hintCell) }), true);
      paint();
      return;
    }
    // a crown that can be proved right now needs no stages
    if (w.place) { clearHint(true); showCrown(w); paint(); return; }
    if (!hintStep || hintStep.text !== w.text) { clearHint(true); hintStep = w; hintStages = stagesOf(w); hintStage = 0; }
    const step = hintStep;
    hintStage++;
    if (hintStage > hintStages.length) { finishStep(step); return; }
    const stage = hintStages[hintStage - 1];
    const todo = stage.offer ? hintTodo(step) : null;
    hintFx = hintFxOf(stage, todo);
    sayHint(stage.text + (todo && todo.length ? ' ' + C.sayCrosses(P.N, todo) : ''), false);
    $('hintApply').hidden = !stage.offer;
    paint();
  }
  $('hintBtn').addEventListener('click', stepHint);
  $('hintApply').addEventListener('click', () => { if (hintStep && !solved) finishStep(hintStep); });

  // ---------------------------------------------------------- the replay
  // The whole chain, from an empty board to the finished one, one step a tap,
  // with the same wash and rings the hint uses. It draws on a board of its
  // own, so the solved board underneath is never touched.
  function replayMarks(upto) {
    const N = P.N, m = new Uint8Array(N * N);
    for (let k = 0; k < upto; k++) {
      const w = replay.steps[k];
      if (w.place) {
        const i = w.place.r * N + w.place.c;
        m[i] = 2;
        for (const j of elim[i]) if (m[j] !== 2) m[j] = 1;
      } else for (const i of w.elim) if (m[i] !== 2) m[i] = 1;
    }
    return m;
  }
  function drawReplay() {
    const f = replay.frames[replay.at];
    const w = f.step, stage = f.stage;
    replay.marks = replayMarks(f.step_i);
    hintCell = -1; hintKind = '';
    if (w.place) { hintCell = w.place.r * P.N + w.place.c; hintKind = 'place'; hintFx = hintFxOf(stage, null); }
    else hintFx = hintFxOf(stage, stage.offer ? w.elim : null);
    $('replayText').textContent = stage.text + (stage.offer && w.crossText ? ' ' + w.crossText : '');
    $('replayWhere').textContent = t('replayWhere', { n: faNum(replay.at + 1), total: faNum(replay.frames.length) });
    $('replayBack').disabled = replay.at === 0;
    $('replayNext').disabled = replay.at >= replay.frames.length - 1;
    paint();
  }
  function startReplay() {
    const steps = C.chain(P.N, P.regions, P.sol);
    if (!steps || !steps.length) return;
    clearHint();
    // One tap a step, all the way through: the replay makes the crosses itself
    // and has no offer to hold back for, so it takes the last stage of each.
    const frames = [];
    steps.forEach((w, k) => {
      const stage = stagesOf(w).slice(-1)[0];
      frames.push({ step: w, step_i: k, stage: stage });
    });
    replay = { steps: steps, frames: frames, at: 0, marks: new Uint8Array(P.N * P.N) };
    $('replayBar').hidden = false;
    drawReplay();
  }
  function endReplay() {
    replay = null;
    $('replayBar').hidden = true;
    clearHint();
    paint();
  }
  $('replayBtn').addEventListener('click', () => { hide('solvedDialog'); startReplay(); });
  $('replayBack').addEventListener('click', () => { if (replay && replay.at > 0) { replay.at--; drawReplay(); } });
  $('replayNext').addEventListener('click', () => { if (replay && replay.at < replay.frames.length - 1) { replay.at++; drawReplay(); } });
  $('replayDone').addEventListener('click', endReplay);

  // ---------------------------------------------------------------- modes
  function setMode(m) {
    mode = m;
    $('modeCampaign').classList.toggle('on', m === 'campaign');
    $('modeRandom').classList.toggle('on', m === 'random');
    $('campaignRow').hidden = m !== 'campaign';
    $('randomRow').hidden = m === 'campaign';
  }
  function goLevel(n) {
    level = (n + LEVELS.campaign.length) % LEVELS.campaign.length;
    setMode('campaign');
    $('hintLine').textContent = '';
    loadPuzzle(LEVELS.campaign[level]);
  }
  function newRandom() {
    setMode('random');
    $('hintLine').textContent = '';
    // generate on the spot when it is quick, fall back to the shipped pool
    let p = null;
    // Made fresh when that is quick, which is every size at Easy and Medium and
    // the small boards at Hard. A 10x10 Hard has to be both even and twisty and
    // takes over a second to find, so the budget stops short of that and the
    // shipped pool answers instantly instead of freezing the board mid-tap.
    try { p = C.generate(randSize, { band: randBand, budgetMs: 500, strict: true }); } catch (e) {}
    let code;
    if (p) code = C.encode(p);
    else {
      const list = LEVELS.pool[String(randSize)][randBand];
      code = list[(Math.random() * list.length) | 0];
    }
    randCode = code;
    loadPuzzle(code);
  }
  $('modeCampaign').addEventListener('click', () => { if (mode !== 'campaign') goLevel(level); });
  $('modeRandom').addEventListener('click', () => { if (mode !== 'random') { if (randCode) { setMode('random'); loadPuzzle(randCode); } else newRandom(); } });
  $('prevBtn').addEventListener('click', () => goLevel(level - 1));
  $('nextBtn').addEventListener('click', () => goLevel(level + 1));
  $('newBtn').addEventListener('click', newRandom);

  const sizes = $('sizes');
  for (const n of [7, 8, 9, 10]) {
    const b = document.createElement('button');
    b.className = 'seg'; b.type = 'button'; b.dataset.size = n; b.textContent = faNum(n);
    b.addEventListener('click', () => { randSize = n; newRandom(); });
    sizes.appendChild(b);
  }
  const diff = $('diff');
  const paintSlider = () => diff.style.setProperty('--fill', (randBand / 2 * 100) + '%');
  diff.addEventListener('input', () => { randBand = +diff.value; paintSlider(); });
  diff.addEventListener('change', () => { randBand = +diff.value; paintSlider(); newRandom(); });

  // -------------------------------------------------------------- dialogs
  function show(id) { $(id).hidden = false; }
  function hide(id) { $(id).hidden = true; }
  $('solvedClose').addEventListener('click', () => hide('solvedDialog'));
  $('solvedNext').addEventListener('click', () => {
    hide('solvedDialog');
    if (mode === 'campaign') goLevel(level + 1); else newRandom();
  });
  $('helpBtn').addEventListener('click', () => { buildDemos(); show('helpDialog'); });
  $('helpClose').addEventListener('click', () => hide('helpDialog'));
  $('levelsBtn').addEventListener('click', () => {
    buildMap();
    show('mapDialog');
    const now = $('mapGrid').querySelector('.now');
    if (now) now.scrollIntoView({ block: 'center' });
  });
  $('mapClose').addEventListener('click', () => hide('mapDialog'));

  // ------------------------------------------------------------- level map
  // every puzzle, ten to a row, nothing locked: solved ones carry a crown and
  // the time she did them in, and the one she is on is filled in
  function buildMap() {
    const g = $('mapGrid');
    g.textContent = '';
    for (let n = 0; n < LEVELS.campaign.length; n++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'maptile' + (progress[n] ? ' done' : '') + (mode === 'campaign' && n === level ? ' now' : '');
      const num = document.createElement('b');
      num.textContent = faNum(n + 1);
      b.appendChild(num);
      const best = levelBests[n];
      if (best != null && showTimer) {
        const small = document.createElement('small');
        small.textContent = clock(best);
        b.appendChild(small);
      }
      if (progress[n]) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'tick');
        svg.setAttribute('aria-hidden', 'true');
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttribute('href', '#crown');
        svg.appendChild(use);
        b.appendChild(svg);
      }
      b.setAttribute('aria-label', t('levelWhere', { n: faNum(n + 1), total: faNum(LEVELS.campaign.length) })
        + (progress[n] ? ' — ' + t('solvedBadge') : ''));
      b.addEventListener('click', () => { hide('mapDialog'); goLevel(n); });
      g.appendChild(b);
    }
  }
  for (const v of document.querySelectorAll('.veil')) v.addEventListener('click', e => { if (e.target === v) v.hidden = true; });

  // ---------------------------------------------------------------- demos
  // four small boards, one per rule, drawn with the same cells as the game
  const DEMOS = [
    { n: 4, regions: '................', queens: [1, 7, 8, 14] },
    { n: 4, regions: 'aabbaabbccddccdd', queens: [1, 7, 8, 14] },
    { n: 3, regions: '.........', queens: [4], ring: true },
    { n: 4, regions: 'aabbaabbccddccdd', queens: [5], auto: true },
  ];
  function buildDemos() {
    for (const host of document.querySelectorAll('.demo')) {
      const spec = DEMOS[+host.dataset.demo];
      const n = spec.n;
      const regions = new Int8Array(n * n);
      for (let i = 0; i < n * n; i++) regions[i] = spec.regions[i] === '.' ? -1 : spec.regions.charCodeAt(i) - 97;
      const crosses = new Set();
      if (spec.ring) for (const j of C.touching(n)[spec.queens[0]]) crosses.add(j);
      if (spec.auto) for (const j of elimSets(n, regions)[spec.queens[0]]) crosses.add(j);
      host.style.gridTemplateColumns = 'repeat(' + n + ', minmax(0, 1fr))';
      host.style.gridTemplateRows = 'repeat(' + n + ', minmax(0, 1fr))';
      host.style.aspectRatio = '1';
      host.style.setProperty('--thick', '3px');
      host.textContent = '';
      for (let i = 0; i < n * n; i++) {
        const r = (i / n) | 0, c = i % n, g = regions[i];
        const d = document.createElement('div');
        d.className = 'cell';
        d.style.aspectRatio = '1';
        d.style.setProperty('--reg', g < 0 ? 'var(--paper-2)' : 'var(--reg' + g + ')');
        const parts = [];
        if (g >= 0) {
          if (r > 0 && regions[i - n] !== g) parts.push('inset 0 3px 0 0 var(--edge)');
          if (r < n - 1 && regions[i + n] !== g) parts.push('inset 0 -3px 0 0 var(--edge)');
          if (c > 0 && regions[i - 1] !== g) parts.push('inset 3px 0 0 0 var(--edge)');
          if (c < n - 1 && regions[i + 1] !== g) parts.push('inset -3px 0 0 0 var(--edge)');
        }
        d.style.setProperty('--edges', parts.length ? parts.join(',') : 'none');
        d.dataset.mark = spec.queens.indexOf(i) >= 0 ? '2' : (crosses.has(i) ? '1' : '0');
        d.innerHTML = '<svg class="crown" aria-hidden="true"><use href="#crown"></use></svg><span class="x"></span>';
        host.appendChild(d);
      }
    }
  }

  // ------------------------------------------------------------- language
  function applyLang() {
    document.documentElement.lang = lang;
    const dir = lang === 'fa' ? 'rtl' : 'ltr';
    for (const el of document.querySelectorAll('header, aside.panel, .sheet')) el.dir = dir;
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    $('status').textContent = t('status');
    $('themeBtn').textContent = isDark() ? t('light') : t('dark');
    for (const el of document.querySelectorAll('.sizes .seg')) el.textContent = faNum(el.dataset.size);
    $('timerBtn').textContent = t(showTimer ? 'hideTimer' : 'showTimer');
    if (P) paintPanel();
    if (!$('helpDialog').hidden) buildDemos();
    if (!$('mapDialog').hidden) buildMap();
  }
  $('themeBtn').addEventListener('click', () => {
    const m = isDark() ? 'light' : 'dark';
    applyTheme(m);
    try { localStorage.setItem(THEME_KEY, m); } catch (e) {}
  });

  // ---------------------------------------------------------------- start
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (saved) {
    mode = saved.mode === 'random' ? 'random' : 'campaign';
    level = Math.min(Math.max(0, saved.level | 0), LEVELS.campaign.length - 1);
    randSize = [7, 8, 9, 10].indexOf(saved.randSize) >= 0 ? saved.randSize : 8;
    randBand = Math.min(2, Math.max(0, saved.randBand | 0));
    randCode = saved.randCode || null;
    autoX = saved.autoX !== false;
    showTimer = saved.showTimer !== false;
    progress = saved.progress4 || {};
    bests = saved.bests || {};
    levelBests = saved.levelBests4 || {};
  }
  setMode(mode);
  applyTimerVisibility();
  diff.value = String(randBand);
  paintSlider();
  // A half-finished board is only picked back up if it is still the board that
  // level holds, for the same reason the progress keys moved.
  const resumable = !!(saved && saved.code) &&
    (mode !== 'campaign' || saved.code === LEVELS.campaign[level]);
  if (resumable) {
    P = C.decode(saved.code);
    buildBoard();
    restoreMarks(saved.marks || '', saved.owners);
    mistakes = saved.mistakes | 0;
    elapsed = saved.elapsed | 0;
    solved = !!saved.solved;
    history = Array.isArray(saved.history) ? saved.history.filter(h => h && typeof h.marks === 'string') : [];
    paint();
    nudgeUnits(C.conflicts(P.N, P.regions, queenCells()), true);
    introBoard();
    paintPanel();
  } else if (mode === 'random') newRandom();
  else goLevel(level);
  applyLang();

  setInterval(() => { if (running && !solved && showTimer) $('timer').textContent = clock(nowElapsed()); }, 500);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopClock(); save(); } });
})();
</script>
</body>
</html>
